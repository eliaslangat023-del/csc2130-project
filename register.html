
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Student Records Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Student Registration</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="register.html">Register Student</a>
        <a href="search.html">Search Student</a>
        <a href="records.html">Student Records</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>
    <section>
        <h2>Register a New Student</h2>

        <form action="#" method="post">
            <fieldset>
                <legend>Student Details</legend>

                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname"
                       placeholder="Enter student's full name" required>

                <label for="studentid">Student ID:</label>
                <input type="text" id="studentid" name="studentid"
                       placeholder="e.g. ST004" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email"
                       placeholder="student@example.com" required>

                <label for="course">Course:</label>
                <select id="course" name="course" required>
                    <option value="">Select a course</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Computer Technology">Computer Technology</option>
                    <option value="Business Information Technology">Business Information Technology</option>
                </select>

                <label for="year">Year of Study:</label>
                <select id="year" name="year" required>
                    <option value="">Select year of study</option>
                    <option value="Year 1">Year 1</option>
                    <option value="Year 2">Year 2</option>
                    <option value="Year 3">Year 3</option>
                    <option value="Year 4">Year 4</option>
                </select>

                <button type="submit">Register Student</button>
            </fieldset>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 Student Records Management System. All rights reserved.</p>
</footer>

</body>
</html>
